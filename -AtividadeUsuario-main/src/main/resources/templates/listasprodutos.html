<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque - Almoxarifado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glow-bg {
            background: radial-gradient(circle at 50% -20%, rgba(59, 130, 246, 0.20), transparent 70%);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-start justify-center min-h-screen p-4 pt-12 relative overflow-x-hidden glow-bg">

<!-- Elementos decorativos -->
<div class="absolute top-0 right-0 w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-0 left-0 w-[400px] h-[400px] bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

<div class="glass-card p-6 sm:p-8 rounded-2xl shadow-2xl w-full max-w-5xl relative z-10 transition-all mb-8">

    <!-- Cabeçalho da Tela -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 border-b border-slate-800 pb-6">
        <div class="flex items-center gap-4">
            <div class="flex-shrink-0 inline-flex items-center justify-center w-12 h-12 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                </svg>
            </div>
            <div>
                <h2 class="text-2xl font-bold tracking-tight text-white">Gestão de Estoque</h2>
                <p class="text-sm text-slate-400 mt-1">Gerencie os itens registrados no almoxarifado.</p>
            </div>
        </div>

        <div class="flex items-center gap-3 w-full sm:w-auto">
            <a href="/usuarios" class="px-4 py-2 bg-slate-800/50 hover:bg-slate-800 border border-slate-700/50 rounded-lg text-sm font-medium text-slate-300 transition-colors text-center w-full sm:w-auto">
                Voltar
            </a>
            <a href="/produtos/novo" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white border border-blue-500 rounded-lg text-sm font-medium transition-colors shadow-lg shadow-blue-500/20 text-center w-full sm:w-auto flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Novo Produto
            </a>
        </div>
    </div>

    <!-- Feedback de Sucesso (Exclusão ou Edição) -->
    <div th:if="${mensagem}" class="flex items-start gap-3 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-4 py-3 rounded-xl mb-6 text-sm">
        <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span th:text="${mensagem}">Operação realizada com sucesso!</span>
    </div>

    <!-- Tabela de Produtos -->
    <div class="bg-slate-900/40 border border-slate-700/50 rounded-xl overflow-x-auto">
        <table class="w-full text-left border-collapse whitespace-nowrap">
            <thead>
            <tr class="bg-slate-800/50 border-b border-slate-700">
                <th class="px-6 py-4 text-xs font-semibold text-slate-300 uppercase tracking-wider">Cód.</th>
                <th class="px-6 py-4 text-xs font-semibold text-slate-300 uppercase tracking-wider">Produto</th>
                <th class="px-6 py-4 text-xs font-semibold text-slate-300 uppercase tracking-wider">Preço Unit.</th>
                <th class="px-6 py-4 text-xs font-semibold text-slate-300 uppercase tracking-wider text-center">Estoque</th>
                <th class="px-6 py-4 text-xs font-semibold text-slate-300 uppercase tracking-wider text-right">Ações</th>
            </tr>
            </thead>
            <tbody>
            <!-- Estado Vazio (Caso não tenha produtos) -->
            <tr th:if="${#lists.isEmpty(produtos)}">
                <td colspan="5" class="px-6 py-8 text-center text-slate-500 text-sm">
                    Nenhum produto cadastrado no momento.
                </td>
            </tr>

            <!-- Loop de Produtos Cadastrados -->
            <tr th:each="prod : ${produtos}" class="border-b border-slate-800/50 hover:bg-slate-800/30 transition-colors group">
                <!-- ID -->
                <td class="px-6 py-4 text-sm text-slate-400 font-medium" th:text="${prod.id}">1</td>

                <!-- Nome e Descrição -->
                <td class="px-6 py-4">
                    <p class="text-sm font-medium text-slate-200" th:text="${prod.nome}">Notebook Dell</p>
                    <p class="text-xs text-slate-500 mt-1 truncate max-w-[200px]" th:text="${prod.descricao}">Descrição do produto...</p>
                </td>

                <!-- Preço -->
                <td class="px-6 py-4 text-sm text-slate-300">
                    R$ <span th:text="${#numbers.formatDecimal(prod.preco, 1, 'POINT', 2, 'COMMA')}">0,00</span>
                </td>

                <!-- Estoque (Muda de cor se o estoque for menor que 5) -->
                <td class="px-6 py-4 text-center">
                        <span th:classappend="${prod.quantidadeEstoque < 5} ? 'bg-red-500/20 text-red-400 border-red-500/30' : 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30'"
                              class="inline-flex items-center justify-center px-2.5 py-1 rounded-md border text-xs font-bold"
                              th:text="${prod.quantidadeEstoque}">
                            10
                        </span>
                </td>

                <!-- Botões de Ação -->
                <td class="px-6 py-4 text-right">
                    <div class="flex items-center justify-end gap-2 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity">

                        <!-- Botão Editar -->
                        <a th:href="@{/produtos/editar/{id}(id=${prod.id})}"
                           class="p-2 bg-blue-500/10 text-blue-400 hover:bg-blue-500/20 rounded-lg transition-colors border border-transparent hover:border-blue-500/30" title="Editar">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                        </a>

                        <!-- Botão Excluir -->
                        <a th:href="@{/produtos/deletar/{id}(id=${prod.id})}"
                           onclick="return confirm('Tem certeza que deseja excluir este produto do estoque?');"
                           class="p-2 bg-red-500/10 text-red-400 hover:bg-red-500/20 rounded-lg transition-colors border border-transparent hover:border-red-500/30" title="Excluir">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
